name: Godot native game validation

on:
  push:
    branches:
      - claude/memory-house-3d-handoff-a0d0e1
    paths:
      - "game/**"
      - ".github/workflows/godot-validate.yml"
  pull_request:
    paths:
      - "game/**"
      - ".github/workflows/godot-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Import and boot (Godot 4.7.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.1
      GODOT_RELEASE: 4.7.1-stable
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download official Godot editor
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"

      - name: Import project
        shell: bash
        run: |
          "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" \
            --headless --path game --editor --quit

      - name: Boot smoke test
        shell: bash
        run: |
          "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" \
            --headless --path game --quit-after 8
