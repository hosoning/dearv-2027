name: Build Blender hero furniture

on:
  push:
    branches:
      - claude/memory-house-3d-handoff-a0d0e1
    paths:
      - "game/tools/build_hero_furniture.py"
      - ".github/workflows/blender-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blender-hero-assets
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          ref: claude/memory-house-3d-handoff-a0d0e1

      - name: Install Blender in the cloud runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender

      - name: Generate GLBs and rendered previews
        run: blender --background --python game/tools/build_hero_furniture.py

      - name: Publish generated assets back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets/models game/assets/previews
          if git diff --cached --quiet; then
            echo "No generated asset changes"
          else
            git commit -m "Generate Blender hero furniture pack"
            git push origin HEAD:claude/memory-house-3d-handoff-a0d0e1
          fi
