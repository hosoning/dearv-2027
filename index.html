<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17130f" />
  <title>dearv-2027</title>
  <style>
    html,body{margin:0;height:100%;background:#17130f;color:#f3eadf;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;overflow:hidden}
    .wrap{text-align:center;padding:24px}.mark{width:42px;height:42px;margin:0 auto 18px;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:18px}.line{font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.68}.dot{display:inline-block;animation:p 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes p{0%,60%,100%{opacity:.25}30%{opacity:1}}
  </style>
  <script>
    (function(){
      var target='./site/'+location.search+location.hash;
      location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="mark">V</div>
    <div class="line">Entering our space <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
  </div>
</body>
</html>
